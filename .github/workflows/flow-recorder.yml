# Always-on order-flow recorder.
# Each run records for ~5h40m; a run is scheduled every hour and the
# concurrency group queues the next one, so it starts as soon as the
# current run ends — near-continuous coverage on free GitHub Actions
# (unlimited minutes on public repos).
# Note: GitHub pauses schedules in repos with no activity for 60 days.
name: flow-recorder

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: flow-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record order flow
        run: npx -y tsx@4 recorder/record.ts
        env:
          TRACK_TOKEN: ${{ secrets.TRACK_TOKEN }}
          RUN_MINUTES: "340"
          COINS: "BTC,ETH,SOL,HYPE"
