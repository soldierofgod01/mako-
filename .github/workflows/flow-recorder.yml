# Always-on order-flow recorder.
# Each run records for ~5h40m. 25 min before it ends it dispatches its own
# successor (mode=handoff), so the two overlap and there is no gap. The hourly
# schedule is only a backup: it exits at once if a recorder is already
# writing (see RUN_MODE in recorder/record.ts).
# No concurrency group on purpose — that queued the next run and made overlap
# impossible. Duplicate writes are harmless (rows dedupe on coin + time).
# Note: GitHub pauses schedules in repos with no activity for 60 days.
name: flow-recorder

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "force = always record · handoff = successor of a running recorder · schedule = only if none is live"
        required: false
        default: force
        type: choice
        options: [force, handoff, schedule]

permissions:
  contents: read
  actions: write   # lets a run dispatch its successor with GITHUB_TOKEN

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record order flow
        run: npx -y tsx@4 recorder/record.ts
        env:
          TRACK_TOKEN: ${{ secrets.TRACK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.mode || 'force' }}
          RUN_MINUTES: "340"
          # Top ~20 HL perps by volume (Nov 2026). Delta/CVD history and flow grading cover these.
          COINS: "BTC,ETH,HYPE,SOL,ZEC,XRP,DOGE,LIT,NEAR,XMR,PUMP,VVV,kPEPE,AAVE,UNI,ZRO,XPL,ENA,WLD,ASTER"
