# Research jobs (no app impact). Runs on pushes to research/* branches or
# manually. Results go to the run summary and an artifact.
name: research

on:
  push:
    branches: ["research/**"]
    paths: ["research/**", ".github/workflows/research.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reversal vs continuation backtest
        run: npx -y tsx@4 research/reversal-backtest.ts
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-results
          path: research-out/
